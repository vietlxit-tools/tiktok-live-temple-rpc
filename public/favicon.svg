<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4a100a" />
      <stop offset="100%" stop-color="#140403" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2a6" />
      <stop offset="50%" stop-color="#f4c150" />
      <stop offset="100%" stop-color="#c69526" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#f4c150" stroke-width="2.5"/>
  <!-- Halo ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffe47a" stroke-width="0.75" stroke-dasharray="3 2" opacity="0.6"/>
  <!-- Golden lotus flower -->
  <g fill="url(#goldGrad)" stroke="#9e7215" stroke-width="0.6" stroke-linejoin="round">
    <!-- Center petal -->
    <path d="M32 13 C27 22, 26 31, 32 44 C38 31, 37 22, 32 13 Z" fill="#fff5be"/>
    <!-- Inner side petals -->
    <path d="M32 20 C23 24, 20 33, 26 43 C30 35, 30 26, 32 20 Z" />
    <path d="M32 20 C41 24, 44 33, 38 43 C34 35, 34 26, 32 20 Z" />
    <!-- Outer petals -->
    <path d="M32 26 C17 28, 13 38, 19 44 C25 39, 27 32, 32 26 Z" opacity="0.95"/>
    <path d="M32 26 C47 28, 51 38, 45 44 C39 39, 37 32, 32 26 Z" opacity="0.95"/>
    <!-- Base lotus throne -->
    <path d="M15 44 C22 48, 30 49, 32 49 C34 49, 42 48, 49 44 C43 47, 34 47.5, 32 47.5 C30 47.5, 21 47, 15 44 Z" fill="#e6ac35"/>
  </g>
  <!-- Sparkle light -->
  <circle cx="32" cy="27" r="1.5" fill="#ffffff" />
</svg>

